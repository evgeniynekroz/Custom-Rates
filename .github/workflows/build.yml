name: Build Custom Rates

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows
            os: windows-latest
          - name: Android32
            os: ubuntu-latest
            target: Android32
          - name: Android64
            os: ubuntu-latest
            target: Android64

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
      - uses: actions/checkout@v4

      # Принудительно ставим SDK перед сборкой
      - name: Setup Geode SDK
        uses: geode-sdk/cli/.github/actions/setup@main

      - name: Build Mod
        uses: geode-sdk/build-geode-mod@main
        with:
          # Теперь переменная GEODE_SDK точно будет существовать
          build-config: "-DCMAKE_PREFIX_PATH=${{ env.GEODE_SDK }}"
          sdk: v5.5.3
          target: ${{ matrix.config.target }}
          combine: true

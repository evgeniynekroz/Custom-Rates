name: Build Custom Rates

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows
            os: windows-latest
          - name: Android32
            os: ubuntu-latest
            target: Android32
          - name: Android64
            os: ubuntu-latest
            target: Android64

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Build Mod
        # Возвращаем @main, так как v2 не существует
        uses: geode-sdk/build-geode-mod@main
        with:
          # Убираем sdk:, пускай экшен сам выберет нужный на основе mod.json
          target: ${{ matrix.config.target }}
          combine: true

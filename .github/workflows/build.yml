name: Build Custom Rates

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows
            os: windows-latest
          - name: Android32
            os: ubuntu-latest
            target: Android32
          - name: Android64
            os: ubuntu-latest
            target: Android64

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Build Mod
        uses: geode-sdk/build-geode-mod@v2
        with:
          # Мы не указываем sdk: v5.5.3, чтобы экшен не искал несуществующий SDK.
          # Он сам поймет, что нужно для geode 3.0.0.
          target: ${{ matrix.config.target }}
          combine: true

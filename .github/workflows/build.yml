name: Build Android Mod

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Mod
        uses: geode-sdk/build-geode-mod@main
        with:
          # МЫ ПИШЕМ ЭТО ЯВНО:
          sdk: v3.7.0
          target: Android64
          combine: true
